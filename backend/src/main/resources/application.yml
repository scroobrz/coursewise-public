spring:
  application:
    name: coursewise-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/coursewise}
    username: ${DATABASE_USERNAME:coursewise}
    password: ${DATABASE_PASSWORD:coursewise}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema — Hibernate validates only
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  security:
    # Default credentials disabled — SecurityConfig provides the rules
    user:
      password: '{noop}changeme'   # overridden in SecurityConfig; here to suppress warning

  # Spring Mail — defaults target Mailpit for local dev/test. Set MAIL_* env
  # vars to point at a real SMTP provider in production.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${coursewise.config.cookie-secure}
        same-site: strict

coursewise:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}
  security:
    csrf:
      enabled: true
  config:
    # ── Backend-only (never exposed via GET /api/v1/config) ──
    cookie-secure: true
    frontend-url: ${FRONTEND_URL:http://localhost:4200}
    from-address: ${COURSEWISE_AUTH_FROM_ADDRESS:noreply@coursewise.com}
    # ── Shared: bound as AppConfigResponse, served verbatim at GET /api/v1/config ──
    shared:
      trusted-device-days: 30
      resend-cooldown-seconds: 60
      magic-link-expiry-minutes: 15
      validation:
        email-regex: "^[sS]\\d{7}@ed\\.ac\\.uk$"
        password-min-length: 8
        password-max-length: 128
        password-regex: "^(?=.*[A-Z])(?=.*[^a-zA-Z]).+$"
        password-regex-description: "Must contain at least one uppercase letter and one non-alphabetic character (number or symbol)"

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.coursewise: DEBUG
    org.springframework.security: WARN
    org.flywaydb: INFO
